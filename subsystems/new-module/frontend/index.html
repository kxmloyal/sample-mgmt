<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>新模块模板</title>
<link rel="stylesheet" href="/css/app.css?v=20260803a" />
</head>
<body>

<fluent-provider style="background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:16px;padding:40px;text-align:center;box-shadow:var(--shadow);max-width:400px">
    <h1 style="margin:0 0 8px">🧩 新模块模板</h1>
    <p style="color:var(--muted);margin:0 0 16px">子系统插件协议工作正常</p>
    <div id="ping-result" style="font-family:monospace;font-size:13px;color:var(--muted)">正在验证 API…</div>
    <a href="/portal.html" style="display:inline-block;margin-top:16px;font-size:14px;color:var(--brand)">← 返回门户</a>
  </div>
</fluent-provider>

<script>
fetch('/api/new-module/ping', {credentials:'include'}).then(function(r){return r.json()}).then(function(d){
  document.getElementById('ping-result').textContent = JSON.stringify(d,null,2);
}).catch(function(e){
  document.getElementById('ping-result').textContent = 'API 错误: ' + e.message;
});
</script>
</body>
</html>
