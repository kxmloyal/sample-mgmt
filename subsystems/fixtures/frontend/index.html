<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230f766e'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='18' font-family='sans-serif'>F</text></svg>" />
<title>制造品质管理系统 - 治具管理</title>
<link rel="stylesheet" href="/css/app.css?v=20260805a" />
<link rel="stylesheet" href="/subsystems/fixtures/frontend/css/module.css?v=20260805a" />
<link rel="preload" href="/vendor/fluentui-web-components.js" as="script" />
<script type="module" src="/vendor/fluentui-web-components.js"></script>
</head>
<body>

<fluent-provider id="provider" style="background:var(--bg);color:var(--text)">
<div id="login" style="display:none;width:100vw;height:100vh;align-items:center;justify-content:center;background:var(--bg)">
  <div style="background:#fff;border-radius:16px;padding:40px;width:360px;max-width:90vw;box-shadow:var(--shadow)">
    <h1 style="margin:0 0 4px;font-size:20px">制造品质管理系统</h1>
    <p style="color:var(--muted);font-size:14px;margin:0 0 20px">治具管理</p>
    <label>账号</label>
    <fluent-text-field id="lg-user" placeholder="如 rd01 / me01 / admin" appearance="outline" style="width:100%;box-sizing:border-box"></fluent-text-field>
    <label>密码</label>
    <fluent-text-field id="lg-pass" type="password" placeholder="密码" appearance="outline" style="width:100%;box-sizing:border-box" onkeydown="if(event.key==='Enter')doLogin()"></fluent-text-field>
    <fluent-button appearance="accent" style="width:100%;margin-top:18px" onclick="doLogin()">登录</fluent-button>
    <div id="lg-err" style="color:var(--bad);font-size:13px;margin-top:8px;text-align:center"></div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="side">
    <div class="logo">治具管理</div>
    <div class="nav" id="nav"></div>
    <div class="me">
      <div><b id="me-name"></b></div>
      <div id="me-role" class="muted"></div>
      <div class="me-actions">
        <a class="btn sm" href="/portal.html">← 返回门户</a>
        <button class="me-link" onclick="doLogout()">退出登录</button>
      </div>
    </div>
  </div>
  <div class="main">
    <div class="topbar"><h2 id="page-title"></h2><div id="page-actions"></div></div>
    <div id="view"></div>
  </div>
</div>
</fluent-provider>

<div class="toast" id="toast"></div>

<script src="/subsystems/fixtures/frontend/js/bundle.js?v=bmsfk71z1" defer></script>
</body>
</html>
