<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232563eb'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='18' font-family='sans-serif'>M</text></svg>" />
<title>制造品质管理系统 - 治具管理</title>
<link rel="stylesheet" href="/css/app.css" />
<style>
.stat{cursor:pointer;transition:box-shadow .15s,background .15s}.stat:hover{background:#f9fafb}.stat.dash-active{box-shadow:0 0 0 2px var(--brand);background:#eef2ff}
</style>
</head>
<body>

<div id="login" style="display:none;width:100vw;height:100vh;align-items:center;justify-content:center;background:var(--bg)">
  <div style="background:#fff;border-radius:16px;padding:40px;width:360px;max-width:90vw;box-shadow:var(--shadow)">
    <h1 style="margin:0 0 4px;font-size:20px">制造品质管理系统</h1>
    <p style="color:var(--muted);font-size:14px;margin:0 0 20px">治具管理</p>
    <label>账号</label>
    <input id="lg-user" placeholder="如 rd01 / me01 / admin" style="width:100%;box-sizing:border-box" />
    <label>密码</label>
    <input id="lg-pass" type="password" placeholder="密码" style="width:100%;box-sizing:border-box" onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="btn" style="width:100%;margin-top:18px" onclick="doLogin()">登录</button>
    <div id="lg-err" style="color:var(--bad);font-size:13px;margin-top:8px;text-align:center"></div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="side">
    <div class="logo">治具管理</div>
    <div class="nav" id="nav"></div>
    <div class="me">
      <div><b id="me-name"></b></div>
      <div id="me-role" class="muted"></div>
      <a href="/portal.html" style="display:block;font-size:12px;color:var(--muted);text-decoration:none;margin-top:4px">← 返回门户</a>
      <button class="btn ghost sm" style="margin-top:8px" onclick="doLogout()">退出登录</button>
    </div>
  </div>
  <div class="main">
    <div class="topbar"><h2 id="page-title"></h2><div id="page-actions"></div></div>
    <div id="view"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/js/shared/utils.js"></script>
<script src="/js/shared/api-base.js"></script>
<script src="/js/fixture-api.js"></script>
<script src="/js/fixture-file-api.js"></script>
<script src="/js/modal.js"></script>
<script src="/js/fixture-dashboard.js"></script>
<script src="/js/fixture-detail.js"></script>
<script src="/js/fixture-list.js"></script>
<script src="/js/fixture-file-ui.js"></script>
<script src="/js/fixture-photo-upload.js"></script>
<script src="/js/fixture-scan.js"></script>
<script src="/js/fixture-logs.js"></script>
<script src="/js/fixture-new.js"></script>
<script src="/js/fixture-router.js"></script>
<script>
window.addEventListener('hashchange',routeFixture);
bootFixture();
</script>
</body>
</html>
