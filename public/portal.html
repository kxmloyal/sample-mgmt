<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0f766e" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232563eb'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='18' font-family='sans-serif'>M</text></svg>" />
<title>制造品质管理系统</title>
<style>
:root{--bg:#f8fafc;--panel:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--brand:#0f766e;--brand-d:#115e59;--shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.04)}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:center;background:var(--brand);color:#fff;padding:0 20px;height:48px;flex-shrink:0}
.topbar .sys-name{font-weight:700;font-size:15px}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.main h1{font-size:24px;margin:0 0 8px;color:var(--text)}
.main .welcome-sub{color:var(--muted);margin:0 0 40px;font-size:14px}
.footer{text-align:center;padding:16px;color:var(--muted);font-size:12px;flex-shrink:0}
</style>
<link rel="stylesheet" href="/css/app.css?v=20260804c">
</head>
<body>
<div class="topbar">
  <div class="sys-name">制造品质管理系统</div>
</div>
<div class="main">
  <h1>欢迎使用制造品质管理系统</h1>
  <p class="welcome-sub">请选择子系统进入</p>
  <div class="portal-cards" id="subsystem-grid">
    <div class="portal-card"><div class="card-desc" style="text-align:center;color:var(--muted);padding:20px">加载子系统…</div></div>
  </div>
</div>
<div class="footer">制造品质管理系统 · <a href="/admin-subsystems.html" style="color:var(--muted);text-decoration:none">子系统管理</a></div>
<script>
// 子系统图标映射（按 manifest.icon 匹配）
var ICONS = {
  flask:  '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6.5L5.2 17.5a2 2 0 0 0 1.7 3h10.2a2 2 0 0 0 1.7-3L14 9.5V3M7.5 14h9"/></svg>',
  wrench: '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-2.4 2.5-2.5Z"/></svg>',
  chart:  '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>',
  _default: '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="12" y2="17"/></svg>'
};

(async function() {
  var grid = document.getElementById('subsystem-grid');
  try {
    var res = await fetch('/api/subsystems');
    var subsystems = await res.json();
    if (!subsystems.length) {
      grid.innerHTML = '<div class="portal-card"><div class="card-desc" style="padding:20px">暂无可用子系统</div></div>';
      return;
    }
    grid.innerHTML = subsystems.map(function(m) {
      var icon = ICONS[m.icon] || ICONS._default;
      return '<a class="portal-card" href="' + m.route.entry + '">' +
        '<span class="card-icon">' + icon + '</span>' +
        '<h3>' + m.name + '</h3>' +
        '<span class="card-desc">' + (m.description || '') + '</span>' +
        '<span class="card-action">进入系统</span>' +
        '</a>';
    }).join('');
  } catch (e) {
    grid.innerHTML = '<div class="portal-card"><div class="card-desc" style="color:#dc2626;padding:20px">加载子系统失败：' + e.message + '</div></div>';
  }
})();
</script>
</body>
</html>
