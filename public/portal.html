<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0f766e" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232563eb'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='18' font-family='sans-serif'>M</text></svg>" />
<title>制造品质管理系统</title>
<style>
:root{--bg:#f8fafc;--panel:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--brand:#0f766e;--brand-d:#115e59;--shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.04)}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:center;background:var(--brand);color:#fff;padding:0 20px;height:48px;flex-shrink:0}
.topbar .sys-name{font-weight:700;font-size:15px}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.main h1{font-size:24px;margin:0 0 8px;color:var(--text)}
.main .welcome-sub{color:var(--muted);margin:0 0 40px;font-size:14px}
.footer{text-align:center;padding:16px;color:var(--muted);font-size:12px;flex-shrink:0}
.login-box{width:320px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:24px;margin:0 auto 32px}
.login-title{font-size:15px;font-weight:600;margin-bottom:16px;text-align:center}
.login-row{margin-bottom:12px}
.login-row input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;box-sizing:border-box}
.login-row input:focus{outline:none;border-color:var(--brand)}
.login-row button{width:100%;padding:9px 0;background:var(--brand);color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer}
.login-row button:hover{background:var(--brand-d)}
.login-row button:disabled{opacity:.6;cursor:not-allowed}
.login-err{color:#dc2626;font-size:12px;text-align:center;min-height:16px}
#user-info{font-size:13px}
</style>
<link rel="stylesheet" href="/css/app.css?v=20260805b">
</head>
<body>
<div class="topbar">
  <div class="sys-name">制造品质管理系统</div>
</div>
<div class="main">
  <h1>欢迎使用制造品质管理系统</h1>
  <div class="welcome-sub">
    <span>请选择子系统进入</span>
    <span class="order-btns" id="order-btns"></span>
    <span id="user-info"></span>
  </div>
  <!-- 未登录时显示内嵌登录框 -->
  <div class="login-box" id="login-box" style="display:none">
    <div class="login-title">用户登录</div>
    <div class="login-row"><input id="lg-user" placeholder="账号" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('lg-pass').focus()" /></div>
    <div class="login-row"><input id="lg-pass" type="password" placeholder="密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')portalLogin()" /></div>
    <div class="login-row"><button type="button" onclick="portalLogin()">登 录</button></div>
    <div class="login-err" id="lg-err"></div>
  </div>
  <!-- 修改密码弹窗（登录后点击 user-info「修改密码」打开；复用登录框样式） -->
  <div class="login-box" id="pwd-box" style="display:none">
    <div class="login-title">修改密码</div>
    <div class="login-row"><input id="cp-old" type="password" placeholder="原密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')document.getElementById('cp-new').focus()" /></div>
    <div class="login-row"><input id="cp-new" type="password" placeholder="新密码（至少6位）" autocomplete="new-password" onkeydown="if(event.key==='Enter')document.getElementById('cp-new2').focus()" /></div>
    <div class="login-row"><input id="cp-new2" type="password" placeholder="确认新密码" autocomplete="new-password" onkeydown="if(event.key==='Enter')doChangePwd()" /></div>
    <div class="login-row"><button type="button" id="cp-btn" onclick="doChangePwd()">确认修改</button></div>
    <div class="login-err" id="cp-err"></div>
  </div>
  <div class="portal-cards" id="subsystem-grid">
    <div class="portal-card"><div class="card-desc" style="text-align:center;color:var(--muted);padding:20px">加载子系统…</div></div>
  </div>
  <div id="portal-toast" class="portal-toast" style="display:none"></div>
</div>
<div class="footer">制造品质管理系统 · <a href="/admin-users.html" style="color:var(--muted);text-decoration:none">用户管理</a> · <a href="/admin-subsystems.html" style="color:var(--muted);text-decoration:none">子系统管理</a></div>
<script>
// 子系统图标映射（按 manifest.icon 匹配）
var ICONS = {
  flask:  '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6.5L5.2 17.5a2 2 0 0 0 1.7 3h10.2a2 2 0 0 0 1.7-3L14 9.5V3M7.5 14h9"/></svg>',
  wrench: '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-2.4 2.5-2.5Z"/></svg>',
  chart:  '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>',
  _default: '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="12" y2="17"/></svg>'
};

var grid = document.getElementById('subsystem-grid');
var state = { cards: [], editMode: false, prefs: [] };

/** 合并排序：prefs 中的 id 按用户顺序置前，未配置的按默认顺序排尾 */
function mergeOrder(list, prefs) {
  var byId = {};
  list.forEach(function (m) { byId[m.id] = m; });
  var ordered = [];
  prefs.forEach(function (id) {
    if (byId[id]) { ordered.push(byId[id]); delete byId[id]; }
  });
  Object.keys(byId).forEach(function (id) { ordered.push(byId[id]); });
  return ordered;
}

function cardHtml(m) {
  var icon = ICONS[m.icon] || ICONS._default;
  var href = state.editMode ? 'javascript:void(0)' : m.route.entry;
  return '<a class="portal-card" draggable="' + state.editMode + '" data-id="' + m.id + '" href="' + href + '">' +
    (state.editMode ? '<span class="card-grip" title="拖动排序">⋮⋮</span>' : '') +
    '<span class="card-icon">' + icon + '</span>' +
    '<h3>' + m.name + '</h3>' +
    '<span class="card-desc">' + (m.description || '') + '</span>' +
    '<span class="card-action">' + (state.editMode ? '拖动排序' : '进入系统') + '</span>' +
    '</a>';
}

function renderCards() {
  grid.classList.toggle('edit-mode', state.editMode);
  grid.innerHTML = state.cards.map(cardHtml).join('');
}

function renderOrderBtns() {
  var box = document.getElementById('order-btns');
  if (state.editMode) {
    box.innerHTML =
      '<button id="btn-save" class="btn-order primary" type="button">保存顺序</button>' +
      '<button id="btn-cancel" class="btn-order" type="button">取消</button>';
    document.getElementById('btn-save').onclick = saveOrder;
    document.getElementById('btn-cancel').onclick = cancelEdit;
  } else {
    box.innerHTML = '<button id="btn-edit" class="btn-order" type="button">编辑排列</button>';
    document.getElementById('btn-edit').onclick = enterEdit;
  }
}

function showToast(msg, isErr) {
  var t = document.getElementById('portal-toast');
  t.textContent = msg;
  t.style.display = 'block';
  t.className = 'portal-toast' + (isErr ? ' err' : '');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function () { t.style.display = 'none'; }, 2500);
}

function enterEdit() {
  // 快照进入编辑态前的卡片顺序，供「取消」恢复（丢弃未保存的拖拽调整）
  state.savedCards = state.cards.slice();
  state.editMode = true;
  renderCards();
  renderOrderBtns();
}
function cancelEdit() {
  if (state.savedCards) state.cards = state.savedCards.slice();
  state.editMode = false;
  renderCards();
  renderOrderBtns();
}

async function saveOrder() {
  var ids = state.cards.map(function (m) { return m.id; });
  try {
    var res = await fetch('/api/portal/prefs', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order: ids })
    });
    if (!res.ok) throw new Error((await res.json()).error || '保存失败');
    state.prefs = ids;
    state.savedCards = null;
    state.editMode = false;
    renderCards();
    renderOrderBtns();
    showToast('已保存排列顺序');
  } catch (e) {
    showToast('保存失败，请重试：' + e.message, true);
  }
}

// 拖拽换位（仅编辑态生效；事件委托到容器）
grid.addEventListener('dragstart', function (e) {
  var card = e.target.closest('.portal-card');
  if (!card || !state.editMode) return;
  state.dragIndex = Array.prototype.indexOf.call(grid.children, card);
  card.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
});
grid.addEventListener('dragover', function (e) {
  if (!state.editMode) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
});
grid.addEventListener('drop', function (e) {
  if (!state.editMode) return;
  e.preventDefault();
  var target = e.target.closest('.portal-card');
  if (!target) return;
  var to = Array.prototype.indexOf.call(grid.children, target);
  if (to === state.dragIndex) return;
  var card = state.cards.splice(state.dragIndex, 1)[0];
  state.cards.splice(to, 0, card);
  renderCards();
});
grid.addEventListener('dragend', function () {
  var dragging = grid.querySelector('.dragging');
  if (dragging) dragging.classList.remove('dragging');
});

// ===== 门户登录（未登录时内嵌登录框，登录后加载子系统卡片）=====
// 门户初始化/登录后渲染：u 已登录 → 加载卡片并显示用户；未登录 → 显示登录框（退出链接内联，避免额外顶层函数）
async function bootPortal(u) {
  if (!u || !u.id) {
    document.getElementById('login-box').style.display = 'block';
    grid.innerHTML = '<div class="portal-card"><div class="card-desc" style="text-align:center;color:var(--muted);padding:20px">登录后显示可用子系统</div></div>';
    return;
  }
  document.getElementById('user-info').innerHTML =
    '<span style="color:var(--muted);margin-right:8px">' + (u.display_name || u.username) + '</span>' +
    '<a href="javascript:openChangePwd()" style="color:var(--brand);text-decoration:none;margin-right:8px">修改密码</a>' +
    '<a href="javascript:fetch(\'/api/logout\',{method:\'POST\',credentials:\'include\'}).then(function(){location.reload()})" style="color:var(--brand);text-decoration:none">退出</a>';
  try {
    var [subRes, prefRes] = await Promise.all([
      fetch('/api/subsystems', { credentials: 'include' }),
      fetch('/api/portal/prefs', { credentials: 'include' })
    ]);
    var subsystems = await subRes.json();
    var prefs = (await prefRes.json()).order || [];
    if (!subsystems.length) {
      grid.innerHTML = '<div class="portal-card"><div class="card-desc" style="padding:20px">暂无可用子系统</div></div>';
      return;
    }
    state.cards = mergeOrder(subsystems, prefs);
    state.prefs = prefs;
    renderCards();
    renderOrderBtns();
  } catch (e) {
    grid.innerHTML = '<div class="portal-card"><div class="card-desc" style="color:#dc2626;padding:20px">加载子系统失败：' + e.message + '</div></div>';
  }
}

// 门户登录：成功后初始化门户（隐藏登录框、加载卡片）
async function portalLogin() {
  var errEl = document.getElementById('lg-err');
  errEl.textContent = '';
  try {
    var res = await fetch('/api/login', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('lg-user').value.trim(),
        password: document.getElementById('lg-pass').value
      })
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || '登录失败');
    document.getElementById('login-box').style.display = 'none';
    document.getElementById('lg-pass').value = '';
    bootPortal(data);
  } catch (e) { errEl.textContent = e.message; }
}

// —— 修改密码（2026-08-13 自助改密；文件顶层函数已达 10 上限，用 IIFE 包裹，不新增顶层函数）——
(function () {
  // 打开修改密码弹窗（仅登录态调用）
  window.openChangePwd = function () {
    document.getElementById('pwd-box').style.display = 'block';
    document.getElementById('cp-old').focus();
  };
  // 提交修改：前端校验 → POST /api/change-password → 成功后刷新（会话已销毁，回到登录框）
  window.doChangePwd = async function () {
    var errEl = document.getElementById('cp-err');
    errEl.textContent = '';
    var oldPwd = document.getElementById('cp-old').value;
    var newPwd = document.getElementById('cp-new').value;
    var newPwd2 = document.getElementById('cp-new2').value;
    if (newPwd.length < 6) { errEl.textContent = '新密码长度至少 6 位'; return; }
    if (newPwd !== newPwd2) { errEl.textContent = '两次输入的新密码不一致'; return; }
    var btn = document.getElementById('cp-btn');
    btn.disabled = true;
    try {
      var res = await fetch('/api/change-password', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ old_password: oldPwd, new_password: newPwd })
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || '修改失败');
      location.reload();
    } catch (e) {
      errEl.textContent = e.message;
      btn.disabled = false;
    }
  };
})();

// 启动：检查登录态 → 初始化门户
(async function () {
  try {
    var r = await fetch('/api/me', { credentials: 'include' });
    bootPortal(await r.json());
  } catch (e) { bootPortal(null); }
})();
</script>
</body>
</html>
