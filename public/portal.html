<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0f766e" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232563eb'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='18' font-family='sans-serif'>M</text></svg>" />
<title>制造品质管理系统</title>
<style>
:root{--bg:#f8fafc;--panel:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--brand:#0f766e;--brand-d:#115e59;--shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.04)}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:center;background:var(--brand);color:#fff;padding:0 20px;height:48px;flex-shrink:0}
.topbar .sys-name{font-weight:700;font-size:15px}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.main h1{font-size:24px;margin:0 0 8px;color:var(--text)}
.main .welcome-sub{color:var(--muted);margin:0 0 40px;font-size:14px}
.cards{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.card{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:32px 40px;width:240px;text-align:center;transition:transform .15s,box-shadow .15s;cursor:pointer;text-decoration:none;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:12px}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(20,30,50,.12)}
.card .icon{font-size:40px;line-height:1}
.card h3{margin:0;font-size:16px}
.card p{margin:0;font-size:13px;color:var(--muted)}
.card .btn-enter{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:8px 24px;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px}
.card .btn-enter:hover{background:var(--brand-d)}
.footer{text-align:center;padding:16px;color:var(--muted);font-size:12px;flex-shrink:0}
@media(max-width:576px){.card{width:100%;max-width:280px}}
</style>
</head>
<body>
<div class="topbar">
  <div class="sys-name">制造品质管理系统</div>
</div>
<div class="main">
  <h1>欢迎使用制造品质管理系统</h1>
  <p class="welcome-sub">请选择子系统进入</p>
  <div class="cards">
    <a class="card" href="/index.html">
      <span class="icon" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6.5L5.2 17.5a2 2 0 0 0 1.7 3h10.2a2 2 0 0 0 1.7-3L14 9.5V3M7.5 14h9"/></svg></span>
      <h3>样品管理</h3>
      <p>限度样品发行·确认·分发</p>
      <span class="btn-enter">进入系统</span>
    </a>
    <a class="card" href="/fixture.html">
      <span class="icon" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-2.4 2.5-2.5Z"/></svg></span>
      <h3>治具管理</h3>
      <p>申请·制作·验证·维修</p>
      <span class="btn-enter">进入系统</span>
    </a>
  </div>
</div>
<div class="footer">制造品质管理系统</div>
</body>
</html>
