<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D 预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; overflow: hidden; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  #toolbar { position: fixed; top: 10px; left: 10px; z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; }
  #toolbar button { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.2); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: background .2s; }
  #toolbar button:hover { background: rgba(255,255,255,.25); }
  #toolbar button.active { background: rgba(255,255,255,.35); border-color: rgba(255,255,255,.5); }
  #info { position: fixed; bottom: 10px; left: 10px; color: rgba(255,255,255,.45); font-size: 12px; z-index: 10; max-width: 60vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); color: rgba(255,255,255,.55); font-size: 14px; z-index: 9; pointer-events: none; }
  .axes-label { position: fixed; bottom: 60px; right: 20px; color: rgba(255,255,255,.3); font-size: 11px; z-index: 10; }
</style>
</head>
<body>
<div id="toolbar">
  <button onclick="viewTop()" title="顶视图 (T)">顶视</button>
  <button onclick="viewFront()" title="前视图 (F)">前视</button>
  <button onclick="viewRight()" title="右视图 (R)">右视</button>
  <button onclick="viewIso()" title="等轴测 (I)">等轴</button>
  <button id="btnWire" onclick="toggleWire()">线框</button>
</div>
<div id="status">加载中…</div>
<div id="info"></div>
<div class="axes-label">鼠标拖拽旋转 · 滚轮缩放 · 右键平移</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

var params = new URLSearchParams(location.search);
var fileUrl = params.get('url');
var fileName = params.get('name') || '';
document.getElementById('info').textContent = fileName || '3D 预览';
document.title = fileName ? fileName + ' - 3D 预览' : '3D 预览';

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(100, 80, 100);
camera.lookAt(0, 0, 0);

var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

var controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(100, 200, 100);
scene.add(dirLight);
var dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
dirLight2.position.set(-100, -50, -50);
scene.add(dirLight2);

var grid = new THREE.GridHelper(200, 20, 0x333355, 0x222244);
scene.add(grid);

var material = new THREE.MeshPhongMaterial({ color: 0x4488cc, specular: 0x111111, shininess: 30 });
var mesh = null;

function loadModel(url) {
  var statusEl = document.getElementById('status');
  statusEl.textContent = '加载模型…';
  var loader = new STLLoader();
  loader.load(url, function(geometry) {
    if (mesh) scene.remove(mesh);
    geometry.center();
    geometry.computeVertexNormals();
    mesh = new THREE.Mesh(geometry, material);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    statusEl.style.display = 'none';
  }, undefined, function(err) {
    statusEl.textContent = '加载失败';
    statusEl.style.color = 'rgba(255,100,100,.8)';
    console.error('STL加载失败:', err);
  });
}

if (fileUrl) loadModel(fileUrl);
else document.getElementById('status').textContent = '未指定文件URL';

window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
animate();

window.viewTop    = function() { camera.position.set(0, 150, 0.1); controls.target.set(0,0,0); controls.update(); };
window.viewFront  = function() { camera.position.set(0, 0, 150); controls.target.set(0,0,0); controls.update(); };
window.viewRight  = function() { camera.position.set(150, 0, 0); controls.target.set(0,0,0); controls.update(); };
window.viewIso    = function() { camera.position.set(80, 80, 80); controls.target.set(0,0,0); controls.update(); };

window.toggleWire = function() {
  material.wireframe = !material.wireframe;
  var btn = document.getElementById('btnWire');
  btn.classList.toggle('active', material.wireframe);
};

// 键盘快捷键
window.addEventListener('keydown', function(e) {
  switch(e.key.toLowerCase()) {
    case 't': viewTop(); break;
    case 'f': viewFront(); break;
    case 'r': viewRight(); break;
    case 'i': viewIso(); break;
    case 'w': toggleWire(); break;
  }
});
</script>
</body>
</html>
